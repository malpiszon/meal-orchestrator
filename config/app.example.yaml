runtime:
  timezone: "Europe/Warsaw"
  # Max number of users whose LLM/email/Discord steps run concurrently.
  # Menu fetching always stays sequential regardless of this value, to
  # avoid bursting the menu provider. Defaults to 5 when omitted.
  max_concurrent_users: 5

llm:
  provider: "openrouter"
  model: "openai/gpt-5-mini"
  dry_run_model: "google/gemini-2.5-flash-lite"
  timeout_seconds: 120
  max_retries: 3
  fallback_models:
    - "google/gemini-3.1-flash-lite"
  # OpenRouter batch mode (beta): submits all users' LLM requests as one batch
  # for a ~50% token-price discount, at the cost of a run taking up to
  # max_wait_hours to finish instead of returning within minutes. The run
  # blocks and polls internally (exponential backoff between
  # initial_poll_interval_seconds and max_poll_interval_seconds) — no
  # separate scheduled job is needed. If the batch doesn't complete in time,
  # the run automatically falls back to synchronous per-user calls so users
  # still get their plan, and sends an ops Discord alert. Disabled by default.
  batch:
    enabled: false
    initial_poll_interval_seconds: 120
    max_poll_interval_seconds: 3600
    max_wait_hours: 26

providers:
  default: "example_provider"

delivery:
  email_from: "Meal Orchestrator <meals@example.com>"
  operational_discord_webhook_env: "DISCORD_OPS_WEBHOOK_URL"

artifacts:
  enabled: true
  path: "/data/artifacts"
  retention_days: 14
  max_runs_per_user: 10
