runtime:
  timezone: "Europe/Warsaw"
  # Max number of users whose LLM/email/Discord steps run concurrently.
  # Menu fetching always stays sequential regardless of this value, to
  # avoid bursting the menu provider. Defaults to 5 when omitted.
  max_concurrent_users: 5

llm:
  provider: "openrouter"
  model: "openai/gpt-6-luna"
  dry_run_model: "deepseek/deepseek-v4-flash"
  timeout_seconds: 120
  max_retries: 3
  fallback_models:
    - "google/gemini-3.5-flash-lite"
    - "deepseek/deepseek-v4.1-flash"
  # model/dry_run_model may be "openrouter/auto" (OpenRouter's Auto Router).
  # It has no batch endpoint: with batch enabled, the batch is submitted with
  # fallback_models (then required) and synchronous calls still start from
  # the Auto Router. Optional router settings, sent only with that model:
  # auto_router:
  #   cost_tier: "low"   # low | medium | high | xhigh | max
  #   allowed_models:
  #     - "openai/*"
  #     - "google/gemini-*"
  # OpenRouter batch mode (beta, ~50% cheaper, blocks a run for up to
  # max_wait_hours). Disabled by default — see README's Known limitations.
  batch:
    enabled: false
    # Durable resume state + run lock; required when enabled. Needs a
    # persistent mount, same as artifacts.path below, to survive restarts.
    state_dir: "/data/batch_state"
    initial_check_delay_seconds: 15
    initial_poll_interval_seconds: 120
    max_poll_interval_seconds: 3600
    max_wait_hours: 26

providers:
  default: "example_provider"

delivery:
  email_from: "Meal Orchestrator <meals@example.com>"
  operational_discord_webhook_env: "DISCORD_OPS_WEBHOOK_URL"
  # Optional best-effort delivery of each user's week to the mo-web dashboard,
  # after the email. Skipped with a warning when token_env's variable is unset.
  mo_web:
    enabled: false
    url: "http://localhost:4321/api/mo/deliveries"
    token_env: "MO_WEB_TOKEN"
    timeout_seconds: 10

artifacts:
  enabled: true
  path: "/data/artifacts"
  retention_days: 14
  max_runs: 10
